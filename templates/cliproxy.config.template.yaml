# Generated by cliproxy-cloud-gateway.
# Public HTTPS should terminate at Caddy; CLIProxyAPI stays private.

host: "127.0.0.1"
port: {{PORT}}
{{PROXY_URL_BLOCK}}

tls:
  enable: false
  cert: ""
  key: ""

remote-management:
  allow-remote: false
  secret-key: ""
  disable-control-panel: true
  disable-auto-update-panel: true

auth-dir: '{{AUTH_DIR}}'

api-keys:
{{API_KEYS_YAML}}

passthrough-headers: true

quota-exceeded:
  switch-project: true
  switch-preview-model: true
  antigravity-credits: false

debug: false
logging-to-file: true
logs-max-total-size-mb: 10
usage-statistics-enabled: false
request-retry: 1
max-retry-credentials: 1
max-retry-interval: 5

routing:
  strategy: "round-robin"
  session-affinity: true
  session-affinity-ttl: "24h"

ws-auth: true

streaming:
  keepalive-seconds: 15
  bootstrap-retries: 1

payload:
  filter:
    - models:
        - name: "gpt-*"
          protocol: "codex"
      params:
        - "reasoning"
        - "reasoning.effort"
        - "thinking"

# Default headers for Codex OAuth model requests.
# Default user-agent: codex_cli_rs/0.114.0 (Mac OS 14.2.0; x86_64) vscode/1.111.0
codex-header-defaults:
  user-agent: '{{CODEX_USER_AGENT}}'
  beta-features: "multi_agent"
